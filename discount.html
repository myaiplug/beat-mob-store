<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discount Rack · The Beat Mob</title>
<link rel="icon" href="img/mark.png" type="image/png" />
<link rel="stylesheet" href="css/store.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body class="page-discount">
<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">THE BEAT MOB</span>
  </a>
  <nav class="site-nav">
    <a href="index.html">Vault</a>
    <a href="discount.html" aria-current="page">Discount Rack</a>
    <a href="designs/index.html">Designs</a>
    <a href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">Gumroad</a>
    <a href="https://thebeatmob.com/" target="_blank" rel="noopener noreferrer">Shop</a>
  </nav>
</header>
<div class="cd-banner-wrap">
  <img class="cd-banner" src="img/cd-banner.png" alt="The Beat Mob Bullys CD" width="1600" height="400" />
</div>
<main class="discount-layout">
  <section class="sale-hero">
    <img class="figure-accent" src="img/figure.jpg" alt="" width="200" height="280" />
    <div class="sale-copy">
      <p class="eyebrow">Limited rack · Trap instrumentals</p>
      <h1>Discount Rack</h1>
      <p class="lede">Same vault energy, sharper price.</p>
      <p class="price-row"><span class="was">$19.99</span> <span class="now-price">$9.99</span></p>
      <div class="gold-rule" aria-hidden="true"></div>
      <a class="buy-btn" href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">Get the deal on Gumroad</a>
    </div>
  </section>
  <section class="discount-list-wrap" aria-label="Discount track list">
    <div id="track-list" class="track-list"></div>
  </section>
</main>
<footer class="site-footer">
  <p>© The Beat Mob · Producers Creators Elite</p>
</footer>
<div class="player" role="region" aria-label="Beat player">
  <div class="player-inner">
    <div class="now">
      <div class="now-art" id="now-art">BM</div>
      <div class="now-text">
        <div class="now-title" id="now-title">Select a beat</div>
        <div class="now-sub" id="now-sub">Discount Rack</div>
      </div>
    </div>
    <div class="transport">
      <div class="transport-controls">
        <button class="t-btn" id="btn-prev" type="button" aria-label="Previous"></button>
        <button class="t-btn main" id="btn-play" type="button" aria-label="Play or pause"></button>
        <button class="t-btn" id="btn-next" type="button" aria-label="Next"></button>
      </div>
      <div class="progress-row">
        <span class="time" id="cur-time">0:00</span>
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span class="time" id="dur-time">0:00</span>
      </div>
    </div>
    <div class="player-side">
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" />
      <a class="ghost" href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">License</a>
    </div>
  </div>
</div>
<script src="js/player-core.js"></script>
<script src="js/discount.js"></script>
</body>
</html>
