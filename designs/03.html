<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl shop · The Beat Mob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>

:root {
  --floor: #d8dde3;
  --bone: #f4f1ea;
  --navy: #1a2744;
  --ink: #1c2433;
  --muted: #667288;
  --player-h: 108px;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding-bottom: calc(var(--player-h) + 20px);
  background:
    linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--floor);
  color: var(--ink); font-family: var(--sans);
}
a { color: var(--navy); }
.shop-bar {
  background: var(--navy); color: var(--bone); padding: 0.85rem 1.25rem;
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
.design-name { font-size: 0.68rem; letter-spacing: 0.24em; text-transform: uppercase; color: #9eb0d6; }
.shop-bar nav { display: flex; gap: 1rem; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
.shop-bar nav a { color: var(--bone); text-decoration: none; }
.shop-bar nav a:hover { text-decoration: underline; }

.intro {
  max-width: 960px; margin: 0 auto; padding: 1.75rem 1.25rem 0.5rem;
}
.intro h1 {
  margin: 0; font-family: var(--display); font-weight: 600;
  font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--navy);
}
.intro p { margin: 0.55rem 0 0; color: var(--muted); max-width: 36rem; }

.bin {
  max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem;
}
#track-list {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem;
}
.track-row {
  display: flex; flex-direction: column; align-items: stretch; gap: 0;
  background: var(--bone); border: 1px solid #b8c0cc; border-radius: 2px;
  padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit;
  box-shadow: 3px 3px 0 rgba(26,39,68,0.12);
  overflow: hidden;
}
.track-row:hover { transform: translateY(-1px); box-shadow: 4px 4px 0 rgba(26,39,68,0.16); }
.track-row.is-current { outline: 2px solid var(--navy); outline-offset: 1px; }
.track-num {
  display: block; padding: 0.85rem 0.85rem 0.2rem;
  font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.sleeve {
  margin: 0 0.85rem; aspect-ratio: 1; background:
    linear-gradient(145deg, #2a3a5c, #1a2744 55%, #0f1729);
  display: grid; place-items: center; color: var(--bone);
  font-family: var(--display); font-size: 1.6rem;
}
.track-main { padding: 0.7rem 0.85rem 0.9rem; }
.track-title {
  display: block; font-family: var(--display); font-size: 1rem; color: var(--navy); line-height: 1.2;
}
.track-sub { display: block; margin-top: 0.25rem; font-size: 0.72rem; color: var(--muted); }
.track-meta { display: none; }

.player {
  position: fixed; left: 0; right: 0; bottom: 0; min-height: var(--player-h);
  background: linear-gradient(180deg, #2a3548, #1a2744);
  color: var(--bone); border-top: 4px solid #0d1422;
  box-shadow: 0 -8px 24px rgba(0,0,0,0.2);
}
.player-inner {
  max-width: 960px; margin: 0 auto; padding: 0.7rem 1.25rem;
  display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 1rem; align-items: center;
}
.now { display: flex; gap: 0.75rem; align-items: center; min-width: 0; }
.now-art {
  width: 54px; height: 54px; border-radius: 50%;
  background: conic-gradient(from 0deg, #0d1422, #5a6d8c, #0d1422 40%, #c9d0dc 41%, #0d1422 42%, #0d1422);
  border: 2px solid #9eb0d6; display: grid; place-items: center;
  font-size: 0.7rem; color: var(--bone);
}
.now-title { font-family: var(--display); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-sub { font-size: 0.7rem; color: #9eb0d6; }
.transport-controls { display: flex; justify-content: center; gap: 0.45rem; }
.t-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid #9eb0d6;
  background: transparent; color: var(--bone); display: grid; place-items: center; cursor: pointer;
}
.t-btn.main { background: var(--bone); color: var(--navy); border: 0; width: 48px; height: 48px; }
.t-btn svg { width: 16px; height: 16px; }
.progress-row { display: grid; grid-template-columns: 40px 1fr 40px; gap: 0.45rem; align-items: center; margin-top: 0.35rem; }
.time { font-size: 0.65rem; color: #9eb0d6; font-variant-numeric: tabular-nums; }
.seek, .volume { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 999px; outline: none; }
.seek::-webkit-slider-thumb, .volume::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--bone);
}
.volume { width: 80px; }
.player-side { display: flex; gap: 0.6rem; align-items: center; }
.ghost { color: #9eb0d6; text-decoration: none; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
@media (max-width: 700px) {
  #track-list { grid-template-columns: 1fr; }
  .player-inner { grid-template-columns: 1fr; }
  .player-side { display: none; }
  body { padding-bottom: 160px; }
}

  </style>
</head>
<body data-design="Vinyl shop">

  <header class="shop-bar">
    <div class="design-name">Design · Vinyl shop</div>
    <nav>
      <a href="../index.html">Front counter</a>
      <a href="../discount.html">Discount bin</a>
      <a href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">Gumroad</a>
    </nav>
  </header>
  <section class="intro">
    <h1>Vault Vol. 1 — browsing bin</h1>
    <p>Thirteen sleeves. No vault prices. Pull a tile, drop the needle, scrub the bar.</p>
  </section>
  <section class="bin">
    <div id="track-list"></div>
  </section>
  <script>
  // Enhance vinyl tiles with sleeve face after first render
  document.addEventListener("DOMContentLoaded", () => {
    const patch = () => {
      document.querySelectorAll("#track-list .track-row").forEach((row) => {
        if (row.querySelector(".sleeve")) return;
        const num = row.querySelector(".track-num");
        const main = row.querySelector(".track-main");
        if (!num || !main) return;
        const sleeve = document.createElement("div");
        sleeve.className = "sleeve";
        const title = row.querySelector(".track-title");
        const letters = (title?.textContent || "BM").replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "BM";
        sleeve.textContent = letters;
        num.after(sleeve);
      });
    };
    const list = document.getElementById("track-list");
    const obs = new MutationObserver(patch);
    obs.observe(list, { childList: true });
    setTimeout(patch, 50);
  });
  </script>


    <div class="player" role="region" aria-label="Beat player">
      <div class="player-inner">
        <div class="now">
          <div class="now-art" id="now-art">BM</div>
          <div class="now-text">
            <div class="now-title" id="now-title">Select a beat</div>
            <div class="now-sub" id="now-sub">Vault Vol. 1</div>
          </div>
        </div>
        <div class="transport">
          <div class="transport-controls">
            <button class="t-btn" id="btn-prev" type="button" aria-label="Previous"></button>
            <button class="t-btn main" id="btn-play" type="button" aria-label="Play or pause"></button>
            <button class="t-btn" id="btn-next" type="button" aria-label="Next"></button>
          </div>
          <div class="progress-row">
            <span class="time" id="cur-time">0:00</span>
            <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
            <span class="time" id="dur-time">0:00</span>
          </div>
        </div>
        <div class="player-side">
          <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" />
          <a class="ghost" href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">License</a>
        </div>
      </div>
    </div>


<script src="../js/player-core.js"></script>
<script src="../js/vault-data.js"></script>
<script>
(() => {
  const TRACKS = window.BEATMOB_VAULT_TRACKS;
  const list = document.getElementById("track-list");
  const meter = document.getElementById("meter");

  function render(state) {
    list.innerHTML = TRACKS.map((t, i) => {
      const current = state && state.index === i;
      const playing = current && state.playing;
      const bpm = t.bpm != null ? t.bpm + " BPM" : "";
      const num = String(t.num).padStart(2, "0");
      return `<button class="track-row${current ? " is-current" : ""}${playing ? " is-playing" : ""}" type="button" data-index="${i}" aria-current="${current ? "true" : "false"}">
        <span class="track-num">${playing ? "❚❚" : num}</span>
        <span class="track-main">
          <span class="track-title">${t.title}</span>
          <span class="track-sub">${t.note || "Vault Vol. 1"}${bpm ? " · " + bpm : ""}</span>
        </span>
        <span class="track-meta">${bpm || "—"}</span>
      </button>`;
    }).join("");
    if (meter) meter.classList.toggle("is-live", !!(state && state.playing));
  }

  const player = window.BeatMobPlayer.createPlayer({
    tracks: TRACKS,
    onChange: (state) => render(state),
  });

  list.addEventListener("click", (e) => {
    const row = e.target.closest("[data-index]");
    if (!row) return;
    const i = Number(row.dataset.index);
    const st = player.getState();
    if (st.index === i && st.playing) player.pause();
    else player.playIndex(i);
  });

  render(player.getState());
})();
</script>

</body>
</html>
