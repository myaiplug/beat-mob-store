<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightclub · The Beat Mob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>

:root {
  --bg: #050308;
  --magenta: #ff2bd6;
  --cyan: #21f0ff;
  --ink: #f5f0ff;
  --muted: #8a8098;
  --player-h: 100px;
  --display: "Anton", Impact, sans-serif;
  --body: "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding-bottom: calc(var(--player-h) + 16px);
  background: radial-gradient(900px 500px at 20% 0%, rgba(255,43,214,0.18), transparent 55%),
              radial-gradient(700px 400px at 90% 20%, rgba(33,240,255,0.12), transparent 50%),
              var(--bg);
  color: var(--ink); font-family: var(--body);
}
a { color: var(--cyan); }
.top {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,43,214,0.35);
}
.design-name {
  font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--magenta);
}
.top nav { display: flex; gap: 0.9rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
.top nav a { text-decoration: none; color: var(--ink); }
.top nav a:hover { color: var(--cyan); }

.stage {
  display: grid; grid-template-columns: 1.2fr 0.9fr; gap: 0;
  min-height: calc(100vh - var(--player-h) - 70px);
}
.now-big {
  padding: 2.5rem 1.5rem 2rem; display: flex; flex-direction: column; justify-content: flex-end;
  border-right: 1px solid rgba(33,240,255,0.25);
  background: linear-gradient(180deg, transparent, rgba(255,43,214,0.08));
}
.now-big .kicker {
  font-size: 0.7rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--cyan);
}
.now-big h1 {
  margin: 0.5rem 0 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(3.2rem, 9vw, 6.5rem); line-height: 0.9; text-transform: uppercase;
  letter-spacing: -0.02em;
}
.now-big h1 span { color: var(--magenta); }
.now-big p { margin: 1rem 0 0; max-width: 28rem; color: var(--muted); font-size: 0.95rem; }

.side {
  padding: 1.25rem 1rem 2rem; overflow: auto;
}
.side-label {
  font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--magenta); margin-bottom: 0.75rem; padding: 0 0.4rem;
}
#track-list { display: flex; flex-direction: column; gap: 0; }
.track-row {
  display: grid; grid-template-columns: 2rem 1fr auto; gap: 0.55rem; align-items: center;
  width: 100%; border: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  background: transparent; color: inherit; text-align: left; padding: 0.55rem 0.4rem;
  cursor: pointer; font: inherit;
}
.track-row:hover { background: rgba(33,240,255,0.05); }
.track-row.is-current { background: rgba(255,43,214,0.12); }
.track-num { font-family: var(--display); font-size: 0.95rem; color: var(--cyan); }
.track-row.is-current .track-num { color: var(--magenta); }
.track-title {
  display: block; font-family: var(--display); font-size: 0.95rem; letter-spacing: 0.02em;
  text-transform: uppercase; line-height: 1.1;
}
.track-sub { display: none; }
.track-meta { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; }

.player {
  position: fixed; left: 0; right: 0; bottom: 0; min-height: var(--player-h);
  background: #0a0610; border-top: 2px solid var(--magenta);
}
.player-inner {
  max-width: 1100px; margin: 0 auto; padding: 0.65rem 1.25rem;
  display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 1rem; align-items: center;
}
.now { display: flex; gap: 0.7rem; align-items: center; min-width: 0; }
.now-art {
  width: 48px; height: 48px; background: linear-gradient(135deg, var(--magenta), var(--cyan));
  color: #050308; display: grid; place-items: center; font-family: var(--display); font-size: 1rem;
}
.now-title { font-family: var(--display); text-transform: uppercase; font-size: 1rem; letter-spacing: 0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-sub { font-size: 0.7rem; color: var(--muted); }
.transport-controls { display: flex; justify-content: center; gap: 0.45rem; }
.t-btn {
  width: 36px; height: 36px; border-radius: 0; border: 1px solid var(--cyan);
  background: transparent; color: var(--cyan); display: grid; place-items: center; cursor: pointer;
}
.t-btn.main { background: var(--magenta); border-color: var(--magenta); color: #050308; width: 46px; height: 46px; }
.t-btn svg { width: 16px; height: 16px; }
.progress-row { display: grid; grid-template-columns: 40px 1fr 40px; gap: 0.45rem; align-items: center; margin-top: 0.35rem; }
.time { font-size: 0.65rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek, .volume { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: rgba(255,255,255,0.15); outline: none; }
.seek::-webkit-slider-thumb, .volume::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; background: var(--cyan); border-radius: 0;
}
.volume { width: 80px; }
.player-side { display: flex; gap: 0.6rem; align-items: center; }
.ghost { color: var(--magenta); text-decoration: none; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; }
@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; }
  .now-big { border-right: 0; border-bottom: 1px solid rgba(33,240,255,0.25); min-height: 40vh; }
  .player-inner { grid-template-columns: 1fr; }
  .player-side { display: none; }
}

  </style>
</head>
<body data-design="Nightclub">

  <div class="top">
    <div class="design-name">Design · Nightclub</div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../discount.html">Discount</a>
      <a href="https://thebeatmob.com/" target="_blank" rel="noopener noreferrer">Shop</a>
    </nav>
  </div>
  <div class="stage">
    <section class="now-big">
      <div class="kicker">The Beat Mob · Live vault</div>
      <h1>Vault<br/><span>Vol. 1</span></h1>
      <p>Thirteen tagged cuts. Hit play, scrub the bar, keep the tags in the mix — quieter than Signal Chain.</p>
    </section>
    <aside class="side">
      <div class="side-label">Tracklist</div>
      <div id="track-list"></div>
    </aside>
  </div>


    <div class="player" role="region" aria-label="Beat player">
      <div class="player-inner">
        <div class="now">
          <div class="now-art" id="now-art">BM</div>
          <div class="now-text">
            <div class="now-title" id="now-title">Select a beat</div>
            <div class="now-sub" id="now-sub">Vault Vol. 1</div>
          </div>
        </div>
        <div class="transport">
          <div class="transport-controls">
            <button class="t-btn" id="btn-prev" type="button" aria-label="Previous"></button>
            <button class="t-btn main" id="btn-play" type="button" aria-label="Play or pause"></button>
            <button class="t-btn" id="btn-next" type="button" aria-label="Next"></button>
          </div>
          <div class="progress-row">
            <span class="time" id="cur-time">0:00</span>
            <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
            <span class="time" id="dur-time">0:00</span>
          </div>
        </div>
        <div class="player-side">
          <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" />
          <a class="ghost" href="https://thebeatmob.gumroad.com/" target="_blank" rel="noopener noreferrer">License</a>
        </div>
      </div>
    </div>


<script src="../js/player-core.js"></script>
<script src="../js/vault-data.js"></script>
<script>
(() => {
  const TRACKS = window.BEATMOB_VAULT_TRACKS;
  const list = document.getElementById("track-list");
  const meter = document.getElementById("meter");

  function render(state) {
    list.innerHTML = TRACKS.map((t, i) => {
      const current = state && state.index === i;
      const playing = current && state.playing;
      const bpm = t.bpm != null ? t.bpm + " BPM" : "";
      const num = String(t.num).padStart(2, "0");
      return `<button class="track-row${current ? " is-current" : ""}${playing ? " is-playing" : ""}" type="button" data-index="${i}" aria-current="${current ? "true" : "false"}">
        <span class="track-num">${playing ? "❚❚" : num}</span>
        <span class="track-main">
          <span class="track-title">${t.title}</span>
          <span class="track-sub">${t.note || "Vault Vol. 1"}${bpm ? " · " + bpm : ""}</span>
        </span>
        <span class="track-meta">${bpm || "—"}</span>
      </button>`;
    }).join("");
    if (meter) meter.classList.toggle("is-live", !!(state && state.playing));
  }

  const player = window.BeatMobPlayer.createPlayer({
    tracks: TRACKS,
    onChange: (state) => render(state),
  });

  list.addEventListener("click", (e) => {
    const row = e.target.closest("[data-index]");
    if (!row) return;
    const i = Number(row.dataset.index);
    const st = player.getState();
    if (st.index === i && st.playing) player.pause();
    else player.playIndex(i);
  });

  render(player.getState());
})();
</script>

</body>
</html>
