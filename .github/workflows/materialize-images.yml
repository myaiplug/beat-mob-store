name: materialize brand images
on:
  push:
    paths:
      - "img/web/**"
      - ".github/workflows/materialize-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: repair and decode brand images
        run: |
          python3 << 'PY'
          import base64, pathlib
          root = pathlib.Path("img/web")
          banner = root / "cd-banner.jpg"
          if banner.exists():
              b = banner.read_bytes()
              if b.startswith(b"/9j/") and len(b) == 24991:
                  b = b[:15834] + b"c" + b[15834:]
                  banner.write_bytes(b)
                  print("repaired cd-banner")
          changed = False
          for f in sorted(root.iterdir()):
              if not f.is_file():
                  continue
              raw = f.read_bytes()
              if raw[:3] in (b"\xff\xd8\xff", b"\x89PN"):
                  print("binary", f.name, len(raw))
                  continue
              try:
                  dec = base64.b64decode(raw, validate=True)
              except Exception as e:
                  print("no decode", f.name, e)
                  continue
              if dec[:3] in (b"\xff\xd8\xff", b"\x89PN"):
                  f.write_bytes(dec)
                  changed = True
                  print("decoded", f.name, len(dec))
              else:
                  print("not image", f.name, dec[:8])
          pathlib.Path("/tmp/changed").write_text("1" if changed else "0")
          PY
          if [ "$(cat /tmp/changed)" = "1" ]; then
            git config user.name "NoDAW Labs"
            git config user.email "219323215+myaiplug@users.noreply.github.com"
            git add img/web
            git commit -m "Materialize brand image binaries"
            git push
          fi
